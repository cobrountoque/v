<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Toque - Pago Móvil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Imagen del Logo */
        .logo {
            width: 180px;
            margin-bottom: 12px;
        }

        /* Títulos */
        .title {
            font-size: 16px;
            font-weight: 800;
            color: #3a3f47;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 12px;
            color: #8fa0a6;
            margin-bottom: 16px;
        }

        /* Botón Instagram */
        .btn-main {
            display: block;
            width: 100%;
            background-color: #3a3f47;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(58, 63, 71, 0.2);
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: #8fa0a6;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Botón BDV */
        .btn-bdv {
            display: block;
            width: 100%;
            background-color: #4a8b99;
            color: #ffffff;
            text-decoration: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(74, 139, 153, 0.25);
        }

        /* Filas de Datos */
        .row {
            background-color: #ffffff;
            border: 1px solid #e5e9ed;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #3a3f47;
        }

        .btn-copy {
            background-color: #eef3f5;
            color: #3a3f47;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-copy:active {
            background-color: #4a8b99;
            color: #ffffff;
        }

        /* Botón Copiar Todos los Datos */
        .btn-copy-all {
            display: block;
            width: 100%;
            background-color: #eef6f8;
            color: #4a8b99;
            border: 1.5px dashed #4a8b99;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-copy-all:active {
            background-color: #4a8b99;
            color: #ffffff;
        }

        /* Adorno inferior con color del logo */
        .footer-shape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #4a8b99;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reemplaza con la ruta real de tu imagen si la tienes en GitHub -->
        <img src="untoque-logo.png" alt="Un Toque" class="logo" onerror="this.onerror=null; this.parentNode.insertAdjacentHTML('afterbegin', '<div style=\'font-size:24px; font-weight:900; color:#3a3f47; margin-bottom:12px;\'>UN <span style=\'color:#4a8b99;\'>TOQUE</span></div>'); this.remove();">

        <div class="title">Con Un Toque haces tus pagos móviles</div>
        <div class="subtitle">Terminal Oficial de Cobro Interbancario</div>

        <a href="https://instagram.com" target="_blank" class="btn-main">
            Ver Instagram de Un Toque
        </a>

        <div class="section-title">OPCIONES DE PAGO MÓVIL</div>

        <!-- 1. BDV -->
        <a href="bdvmovil://" class="btn-bdv">
            Pagar directo con BDV App
        </a>

        <!-- 2. Banco -->
        <div class="row">
            <span>Banco: <span id="banco">0105 - Banco Mercantil</span></span>
            <button class="btn-copy" onclick="copiar('0105 - Banco Mercantil')">Copiar</button>
        </div>

        <!-- 3. Cédula -->
        <div class="row">
            <span>Cedula: <span id="cedula">V30911172</span></span>
            <button class="btn-copy" onclick="copiar('V30911172')">Copiar</button>
        </div>

        <!-- 4. Teléfono -->
        <div class="row">
            <span>Teléfono: <span id="telefono">0412-6732004</span></span>
            <button class="btn-copy" onclick="copiar('04126732004')">Copiar</button>
        </div>

        <!-- 5. Copiar Todos -->
        <button class="btn-copy-all" onclick="copiarTodos()">
            📋 Copiar todos los datos
        </button>

        <div class="footer-shape"></div>
    </div>

    <script>
        function copiar(texto) {
            navigator.clipboard.writeText(texto);
            alert('¡Copiado!');
        }

        function copiarTodos() {
            const banco = document.getElementById('banco').innerText;
            const cedula = document.getElementById('cedula').innerText;
            const telefono = document.getElementById('telefono').innerText;
            const todo = `Banco: ${banco}\nCedula: ${cedula}\nTeléfono: ${telefono}`;
            
            navigator.clipboard.writeText(todo);
            alert('¡Todos los datos copiados!');
        }
    </script>

</body>
</html>
