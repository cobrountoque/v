<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Reinozo - Tarjeta Ejecutiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            padding-bottom: 30px;
        }
        
        /* Imagen Banner Superior (Ajustada según su imagen) */
        .banner-header {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #0042a5 0%, #001233 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .banner-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Foto de perfil */
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #161b22;
            margin-top: -45px;
            background-color: #21262d;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            margin-top: 12px;
            color: #f0f6fc;
        }
        .user-role {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 24px;
        }

        /* Botones de enlaces */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #30363d;
            transition: all 0.2s;
        }
        .btn-link:active {
            transform: scale(0.98);
            background-color: #30363d;
        }
        .btn-save-contact {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: #ffffff;
            border: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Banner con imagen centrada -->
        <div class="banner-header">
            <div class="banner-title">CURAÇAO</div>
        </div>

        <!-- Foto de Perfil (placeholder) -->
        <div style="display: flex; justify-content: center;">
            <div class="profile-avatar" style="display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:24px;">JR</div>
        </div>

        <h1 class="user-name">Javier Reinozo</h1>
        <p class="user-role">Ejecutivo / Representante Comercial</p>

        <div class="links-group">
            <!-- Guardar contacto -->
            <a href="#" class="btn-link btn-save-contact">
                🎴 Guardar Contacto en Agenda
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/58000000000" class="btn-link" target="_blank">
                💬 Enviar WhatsApp
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" class="btn-link" target="_blank">
                📸 Ver Perfil de Instagram
            </a>

            <!-- Llamada directa -->
            <a href="tel:+58000000000" class="btn-link">
                📞 Llamada Telefónica
            </a>

            <!-- Google Maps -->
            <a href="https://maps.google.com" class="btn-link" target="_blank">
                📍 Ver Ubicación en Google Maps
            </a>
        </div>
    </div>

</body>
</html>
