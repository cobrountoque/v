<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Reinozo - Samsung Center Service Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            padding-bottom: 30px;
        }
        
        /* Banner Header con la imagen corporativa */
        .banner-header {
            width: 100%;
            height: 170px;
            background-image: url('fondobueno.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Foto de perfil */
        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #161b22;
            margin-top: -55px;
            object-fit: cover;
            background-color: #21262d;
            position: relative;
            z-index: 2;
        }

        .user-name {
            font-size: 22px;
            font-weight: 700;
            margin-top: 10px;
            color: #f0f6fc;
        }
        .user-role {
            font-size: 16px;
            color: #38bdf8;
            font-weight: 700;
            margin-top: 6px;
        }
        .user-company {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        /* Botones de enlaces */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #30363d;
            transition: all 0.2s;
        }
        .btn-link:active {
            transform: scale(0.98);
            background-color: #30363d;
        }
        
        /* Botón Destacado de Productos */
        .btn-products {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: #ffffff;
            border: none;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Banner de fondo con la imagen de Samsung / Curaçao -->
        <div class="banner-header"></div>

        <!-- Foto de perfil circular -->
        <div style="display: flex; justify-content: center;">
            <img src="javierfoton.jpg" alt="Javier Reinozo" class="profile-avatar">
        </div>

        <h1 class="user-name">Javier Reinozo</h1>
        <p class="user-role">Samsung Center Service Manager</p>
        <p class="user-company">CURAÇAO</p>

        <div class="links-group">
            <!-- Botón Destacado de Productos / Tienda -->
            <a href="#" class="btn-link btn-products" target="_blank">
                🛍️ Ver Nuestros Productos
            </a>

            <!-- WhatsApp Directo -->
            <a href="https://wa.me/584247330872" class="btn-link" target="_blank">
                💬 WhatsApp Directo
            </a>

            <!-- Llamada telefónica -->
            <a href="tel:+584247330872" class="btn-link">
                📞 Llamar al Teléfono
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/jlreinozo" class="btn-link" target="_blank">
                📸 Instagram (@jlreinozo)
            </a>

            <!-- Correo -->
            <a href="mailto:jreinozo@tekspotla.com" class="btn-link">
                ✉️ Enviar Correo Electrónico
            </a>

            <!-- Ubicación Google Maps corregida con coordenadas -->
            <a href="https://www.google.com/maps?q=12.135228,-68.957562" class="btn-link" target="_blank">
                📍 Ubicación en Google Maps
            </a>

            <!-- Guardar Contacto vCard -->
            <a href="contacto-javier.vcf" class="btn-link" style="border-color: #2996da; color: #58a6ff;">
                🎴 Guardar Contacto en Agenda
            </a>
        </div>
    </div>

</body>
</html>
